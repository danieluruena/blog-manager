name: Migrate D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "migrate" para aplicar las migraciones remotas'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  CI: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  migrate:
    name: Apply migrations
    if: github.event.inputs.confirm == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply blog-manager-db --remote
